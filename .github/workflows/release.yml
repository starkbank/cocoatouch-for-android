name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version for the dry-run bundle
        default: 0.0.0-dryrun

permissions:
  contents: read

concurrency: release

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sh scripts/check-release-environment.sh "$GITHUB_REPOSITORY" maven-central
        env:
          GH_TOKEN: ${{ github.token }}
  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: maven-central
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: echo "$(curl -sfL https://services.gradle.org/distributions/gradle-8.13-wrapper.jar.sha256)  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - if: github.event_name == 'workflow_dispatch'
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          [[ "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$ ]]
          echo "VERSION=$VERSION_INPUT" >> "$GITHUB_ENV"
          echo "DEPLOYMENT=cocoatouch-$VERSION_INPUT-dryrun-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      - if: github.event_name == 'release'
        run: |
          VERSION=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          test "$GITHUB_REF_NAME" = "v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DEPLOYMENT=cocoatouch-$VERSION" >> "$GITHUB_ENV"
      - if: github.event_name == 'release'
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          grep -q "^## \[$VERSION\]" CHANGELOG.md
      - run: ./gradlew --no-daemon :cocoatouch:testDebugUnitTest
      - run: ./gradlew --no-daemon :cocoatouch:centralBundle -PVERSION_NAME="$VERSION"
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
      - run: sh scripts/verify-central-bundle.sh cocoatouch/build/distributions/central-bundle.zip "$VERSION"
      - run: test "$(unzip -Z1 cocoatouch/build/distributions/central-bundle.zip | grep -c '\.asc$')" = "5"
      - run: sh scripts/upload-central-bundle.sh cocoatouch/build/distributions/central-bundle.zip "$DEPLOYMENT" "$MODE" "$VERSION"
        env:
          MODE: ${{ github.event_name == 'release' && 'keep' || 'drop' }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
