import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
    id 'signing'
}

group = 'com.starkbank'
version = VERSION_NAME

android {
    namespace 'com.starkbank.cocoatouch'
    compileSdk 36
    resourcePrefix 'cocoatouch_'

    defaultConfig {
        minSdk 25
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        error.add('ResourceName')
        abortOnError true
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
    testOptions {
        // Below 28 the system saves the state before onStop, a different order from the one the consuming apps get
        targetSdk 36
        // UIColor's default argument calls Color.parseColor, which throws in the android.jar stub
        unitTests.returnDefaultValues = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_1_8)
        optIn.add('com.starkbank.cocoatouch.annotation.InternalCocoaTouchApi')
    }
}

dependencies {
    // api: UIActivity extends AppCompatActivity and UIFragment extends Fragment in public signatures
    api 'androidx.appcompat:appcompat:1.7.0'
    api 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // api: UITableView and UICollectionView expose RecyclerView in public signatures
    api 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

publishing {
    publications {
        release(MavenPublication) {
            artifactId = 'cocoatouch'
            afterEvaluate { from components.release }
            pom {
                name = 'cocoatouch'
                description = 'CocoaTouch (UIKit) interfaces for Android, written in Kotlin.'
                url = 'https://github.com/starkbank/cocoatouch-for-android'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://github.com/starkbank/cocoatouch-for-android/blob/master/LICENSE'
                    }
                }
                developers {
                    developer {
                        id = 'starkbank'
                        name = 'Stark Bank'
                        organization = 'Stark Bank'
                        organizationUrl = 'https://starkbank.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/starkbank/cocoatouch-for-android.git'
                    developerConnection = 'scm:git:ssh://github.com/starkbank/cocoatouch-for-android.git'
                    url = 'https://github.com/starkbank/cocoatouch-for-android'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'centralBundle'
            url = layout.buildDirectory.dir('central-bundle')
        }
    }
}

signing {
    def signingKey = project.findProperty('signingKey')
    if (signingKey) {
        useInMemoryPgpKeys(signingKey, project.findProperty('signingPassword'))
    }
    required { gradle.taskGraph.hasTask(':cocoatouch:centralBundle') && !project.hasProperty('unsignedBundle') }
    sign publishing.publications.release
}

// Fails when the task graph is ready, before signing runs, so this message is the first error
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':cocoatouch:centralBundle') && project.version.toString().endsWith('-SNAPSHOT')) {
        throw new GradleException("Central rejects SNAPSHOT versions: ${project.version}")
    }
}

def cleanCentralBundle = tasks.register('cleanCentralBundle', Delete) {
    delete layout.buildDirectory.dir('central-bundle'), layout.buildDirectory.file('distributions/central-bundle.zip')
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn cleanCentralBundle
}

tasks.register('centralBundle', Zip) {
    dependsOn 'publishReleasePublicationToCentralBundleRepository'
    // The Portal expects the Maven layout at the zip root, only the released version, without metadata files
    from(layout.buildDirectory.dir('central-bundle')) {
        include "com/starkbank/cocoatouch/${project.version}/**"
    }
    archiveFileName = 'central-bundle.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
}
